<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download — UrbanDreamer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif}
header{padding:56px 24px 20px;max-width:1200px;margin:0 auto;text-align:center}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:.04em}
h1 .g{background:linear-gradient(90deg,#e7b75f,#d9b45b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:#8b94a7;margin-top:10px;font-size:15px;max-width:640px;margin-left:auto;margin-right:auto}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px auto 8px;max-width:1000px}
.filters button{background:#161b22;color:#8b94a7;border:1px solid #21262d;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13.5px;transition:.15s}
.filters button:hover{color:#e6edf3}
.filters button.active{background:#e7b75f;color:#161400;border-color:#e7b75f;font-weight:600}
.grid{max-width:1200px;margin:24px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:#161b22;border:1px solid #21262d;border-radius:14px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:#30363d;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.imgwrap{aspect-ratio:2/3;background:#0d1117;overflow:hidden}
.imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:15.5px;font-weight:600;padding:14px 16px 4px}
.card .sub{color:#8b94a7;font-size:12.5px;padding:0 16px}
.card .foot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 16px;margin-top:auto}
.card .price{font-size:16px;font-weight:700;color:#e7b75f}
.buy{background:#e7b75f;color:#161400;border:none;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;transition:.15s}
.buy:hover{background:#f0c873}
footer{text-align:center;color:#4d5564;font-size:12px;padding:30px 20px 44px}
.tag{display:inline-block;font-size:11px;color:#8b94a7;border:1px solid #21262d;border-radius:999px;padding:2px 10px;margin:2px 4px 0 0}

.dlbox{max-width:560px;margin:60px auto;background:#161b22;border:1px solid #21262d;border-radius:14px;padding:32px;text-align:center}
.dlbox .ok{color:#7ee787;margin:12px 0}
.dlbox .buy{display:inline-block;margin:14px 0}
.dlbox .note{color:#8b94a7;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="dlbox" id="dl"><p>Loading…</p></div>
<script>
const P = new URLSearchParams(location.search);
const pid = P.get('pid');
const DATA = [{"slug": "hong-kong", "style": "minimal_beige", "title": "Hong Kong, Hong Kong \u2013 Digital Map Poster \u2013 Minimal Beige", "size_mb": 0.3}, {"slug": "hong-kong", "style": "gold_night", "title": "Hong Kong, Hong Kong \u2013 Digital Map Poster \u2013 Gold Night", "size_mb": 0.4}, {"slug": "hong-kong", "style": "noir", "title": "Hong Kong, Hong Kong \u2013 Digital Map Poster \u2013 Noir", "size_mb": 0.8}];
const item = DATA.find(d => (d.slug + '_' + d.style) === pid);
const box = document.getElementById('dl');
if (!item) {
  box.innerHTML = '<p style="color:#e06b4f">Invalid product link. If you just paid, contact us with your order details.</p>';
} else {
  const base = './files/';
  box.innerHTML = `
    <h2>${item.title}</h2>
    <p class="ok">✓ Payment confirmed. Thank you for your purchase!</p>
    <p>Download your high-resolution poster (1536×2304 PNG):</p>
    <a class="buy" href="${base}${item.slug}_${item.style}.jpg" download>Download JPG (${item.size_mb} MB)</a>
    <p class="note">License: personal use. © OpenStreetMap contributors. Please keep the file for your own use.</p>`;
}
</script>
</body>
</html>
