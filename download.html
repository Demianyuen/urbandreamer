<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download — UrbanDreamer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F5F5F7;color:#1A1A1A;font-family:-apple-system,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif}
header{background:#0A0A0A;color:#fff;padding:20px 24px;text-align:center}
header .logo{font-size:22px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
header .logo .g{color:#E7B75F}
header .lede{color:#B0B0B0;font-size:13.5px;margin-top:6px;max-width:640px;margin-left:auto;margin-right:auto}
.hero{padding:44px 24px 8px;text-align:center}
.hero h1{font-size:clamp(26px,4.5vw,40px);letter-spacing:.02em}
.hero p{color:#666;margin-top:8px;font-size:15px}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:24px auto 6px;max-width:1000px}
.filters button{background:#fff;color:#555;border:1px solid #DDD;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13.5px;transition:.15s}
.filters button:hover{color:#000;border-color:#999}
.filters button.active{background:#0A0A0A;color:#fff;border-color:#0A0A0A;font-weight:600}
.grid{max-width:1200px;margin:22px auto 50px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#fff;border:1px solid #E4E4E4;border-radius:10px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.10);border-color:#CCC}
.imgwrap{aspect-ratio:2/3;background:#eee;overflow:hidden}
.imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{font-size:15.5px;font-weight:700;padding:13px 16px 3px;color:#111}
.card .sub{color:#888;font-size:12.5px;padding:0 16px}
.card .foot{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 15px;margin-top:auto}
.card .price{font-size:16px;font-weight:700}
.buy{background:#0A0A0A;color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
.buy:hover{background:#333}
.tag{display:inline-block;font-size:11px;color:#777;border:1px solid #E0E0E0;border-radius:999px;padding:2px 10px;margin:2px 4px 0 0;background:#FAFAFA}
.faq{max-width:760px;margin:10px auto 50px;padding:0 24px}
.faq h2{font-size:21px;margin-bottom:14px}
.faq details{background:#fff;border:1px solid #E4E4E4;border-radius:10px;padding:12px 16px;margin-bottom:8px}
.faq summary{cursor:pointer;font-weight:600;font-size:14.5px}
.faq p{color:#666;font-size:13.5px;margin-top:8px}
footer{text-align:center;color:#999;font-size:12px;padding:30px 20px 44px}

.dlbox{max-width:560px;margin:60px auto;background:#161b22;border:1px solid #21262d;border-radius:14px;padding:32px;text-align:center}
.dlbox .ok{color:#7ee787;margin:12px 0}
.dlbox .buy{display:inline-block;margin:14px 0}
.dlbox .note{color:#8b94a7;font-size:12px;margin-top:10px}
</style>
</head>
<body>
